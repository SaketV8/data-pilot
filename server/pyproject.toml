[project]
name = "server"
version = "0.1.0"
description = "Data Pilot API: chat with CSV and Excel data using DuckDB and NVIDIA NIM"
readme = "README.md"
authors = [
    { name = "Saket Maurya", email = "saketkumarmaurya16@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.146.0",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlglot>=30.23.0",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
